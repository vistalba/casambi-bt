name: Release

# Builds the package in public CI from a version tag (e.g. v0.5.0b1) and
# attaches it to the GitHub release of that tag. The tag must match the
# version in setup.cfg.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = //p' setup.cfg)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in setup.cfg"
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
          pytest
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *a*|*b*|*rc*) prerelease="--prerelease" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* $prerelease \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
